<input placeholder="tap me" />
<div id="popover"></div>
<script>
  const input = document.querySelector('input');
  const popover = document.getElementById('popover');
  (function place() {
    const r = input.getBoundingClientRect();
    popover.style.transform = `translate(${r.left}px, ${r.bottom + 4}px)`;
    popover.textContent = `visualViewport.offsetTop = ${visualViewport.offsetTop.toFixed(1)}`;
    requestAnimationFrame(place);
  })();
</script>
